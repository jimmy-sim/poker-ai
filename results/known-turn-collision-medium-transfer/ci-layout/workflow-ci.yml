name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            exact-python: '3.11.17'
            exact-numpy: '2.4.6'
            job_name: Python 3.11 shard A
            shard: '0'
          - python-version: '3.11'
            exact-python: '3.11.17'
            exact-numpy: '2.4.6'
            job_name: Python 3.11 shard B
            shard: '1'
          - python-version: '3.12'
            exact-python: '3.12.15'
            exact-numpy: '2.5.4'
            job_name: Python 3.12
            shard: all
    env:
      # uv sync must use the tested patch version, not an OS interpreter.
      UV_PYTHON: ${{ matrix.exact-python }}
      EXPECTED_NUMPY: ${{ matrix.exact-numpy }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Recorded evidence authenticates historical source commit trees.
          fetch-depth: 0
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          python-version: ${{ matrix.exact-python }}
          enable-cache: true
      - name: Install locked dependencies
        run: make setup
      - name: Verify actual installed runtime
        run: |
          uv run --locked python -c 'import os, sys, numpy; actual = sys.version.split()[0]; assert actual == os.environ["UV_PYTHON"], (actual, os.environ["UV_PYTHON"]); assert numpy.__version__ == os.environ["EXPECTED_NUMPY"]; print("ACTUAL_PYTHON=" + actual); print("ACTUAL_NUMPY=" + numpy.__version__)'
      - name: Check lint, formatting, and types
        run: make lint typecheck
      - name: Check fast tests
        env:
          FAST_TEST_SHARD: ${{ matrix.shard }}
        run: |
          if [[ "$FAST_TEST_SHARD" == all ]]; then
            make test
          else
            mapfile -t test_files < <(uv run --locked python -c 'from pathlib import Path; import os; files=sorted({*Path("tests").rglob("test_*.py"),*Path("tests").rglob("*_test.py")}); assert len(files)>=2 and all(p.is_file() and not p.is_symlink() for p in files); print(*(str(p) for i,p in enumerate(files) if i%2==int(os.environ["FAST_TEST_SHARD"])), sep="\n")')
            (( ${#test_files[@]} > 0 ))
            printf 'Python 3.11 shard %s: %s test files\n' "$FAST_TEST_SHARD" "${#test_files[@]}"
            uv run --locked pytest -q -m 'not slow' "${test_files[@]}"
          fi
      - name: Validate and run commit hooks
        run: |
          uv run --locked pre-commit validate-config
          uv run --locked pre-commit run --all-files

  python311:
    name: Python 3.11
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Require every sharded and full job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
