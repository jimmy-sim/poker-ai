name: Implementation
description: A concrete software change with reviewable acceptance criteria.
title: "[Implementation] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired behavior
      description: Give a concrete trigger and expected result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and evidence
      description: Relevant checks, artifact paths, and any material limits.
    validations:
      required: true
