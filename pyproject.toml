[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "poker-ai"
version = "0.1.0"
description = "Poker simulation and reproducible game-theoretic research from first principles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
validation = ["treys==0.1.8"]
engine-validation = ["pokerkit==0.7.7"]

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
required-version = "==0.13.5"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_ai"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Use the running interpreter; the Python 3.11 CI job enforces the baseline.
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
markers = [
    "slow: long-running validation; select explicitly outside routine CI",
]

